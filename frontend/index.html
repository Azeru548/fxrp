<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FXRP Pay — Pay with XRP, settle on Flare</title>
<script src="ethers.umd.min.js"></script>
<style>
  :root { --bg:#0d0d1a; --card:#17172b; --accent:#b48eff; --text:#e8e8f5; --muted:#9a9ab5; --ok:#4ade80; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; justify-content:space-between; align-items:center; padding:16px 24px; border-bottom:1px solid #26263d; }
  header h1 { font-size:18px; margin:0; color:var(--accent); }
  header h1 small { color:var(--muted); font-weight:400; }
  .card { background:var(--card); border:1px solid #26263d; border-radius:12px; padding:20px; max-width:560px; margin:24px auto; }
  label { display:block; margin:14px 0 6px; font-size:13px; color:var(--muted); }
  input, select { width:100%; padding:10px; border-radius:8px; border:1px solid #33335a; background:#0f0f22; color:var(--text); font-size:14px; }
  button { margin-top:18px; width:100%; padding:12px; border:0; border-radius:8px; background:var(--accent); color:#0d0d1a; font-weight:700; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  #status, #payStatus { font-size:13px; color:var(--muted); margin-top:14px; word-break:break-all; }
  .ok { color:var(--ok); }
  .nav { display:flex; gap:8px; margin-bottom:4px; }
  .nav a { color:var(--muted); text-decoration:none; font-size:14px; padding:6px 12px; border-radius:8px; }
  .nav a.active { background:#26263d; color:var(--text); }
  .big { font-size:22px; font-weight:700; }
  .muted { color:var(--muted); font-size:13px; }
  .paylink { display:block; background:#0f0f22; border:1px solid #33335a; border-radius:8px; padding:10px; margin-top:14px; font-size:12px; color:var(--accent); word-break:break-all; }
  #walletModal { display:none; position:fixed; inset:0; background:rgba(5,5,15,.7); backdrop-filter:blur(4px); align-items:center; justify-content:center; z-index:100; }
  .wallet-card { background:var(--card); border:1px solid #33335a; border-radius:16px; padding:24px; width:min(92vw,380px); }
  .wallet-card h3 { margin:0 0 4px; color:var(--text); font-size:18px; }
  .wallet-card .muted { margin:0 0 8px; }
  .wallet-btn { display:flex; align-items:center; gap:12px; width:100%; margin:8px 0; padding:12px 14px; border:1px solid #33335a; border-radius:12px; background:#0f0f22; color:var(--text); font-size:15px; cursor:pointer; font-weight:500; }
  .wallet-btn:hover { border-color:var(--accent); background:#17172b; }
  .wallet-icon { width:28px; height:28px; border-radius:6px; }
  .wallet-error { color:#f87171; font-size:13px; padding:10px; border:1px solid #7f1d1d; background:#2a1215; border-radius:8px; margin-top:8px; word-break:break-word; }
  .no-wallets { color:var(--muted); font-size:13px; padding:8px 0; }
  .wallet-close { margin-top:12px; text-align:center; color:var(--muted); font-size:13px; cursor:pointer; }
  .wallet-close:hover { color:var(--text); }
</style>
</head>
<body>
<header>
  <h1>FXRP Pay <small>pay with XRP, settle on Flare</small></h1>
  <button id="connect" style="width:auto;margin:0;padding:8px 14px;font-size:13px;">Connect wallet</button>
</header>

<main id="app" style="display:none;">
  <div class="card">
    <div class="nav">
      <a href="#/create" data-view="create" class="active">Create invoice</a>
      <a href="#/pay" data-view="pay">Pay invoice</a>
    </div>

    <section id="view-create">
      <label>Invoice priced in</label>
      <select id="pricing">
        <option value="1">USD (converted on-chain via FTSOv2 XRP/USD)</option>
        <option value="0">Fixed FXRP amount</option>
      </select>

      <label id="amountLabel">Amount in USD cents (5000 = $50.00)</label>
      <input id="amount" type="number" value="5000" min="1" step="1" />

      <label>Merchant address (receives the FXRP)</label>
      <input id="payee" placeholder="Defaults to your connected wallet" />

      <label>Payment token address (FXRP)</label>
      <input id="token" placeholder="0x... (Test FXRP / FXRP contract)" />

      <label>Memo / description</label>
      <input id="memo" placeholder="e.g. Invoice #42 — SaaS subscription" />

      <button id="createBtn">Create payment link</button>
      <div id="status"></div>
      <span class="paylink" id="paylink" style="display:none;"></span>
    </section>

    <section id="view-pay" style="display:none;">
      <label>Contract address</label>
      <input id="pContract" placeholder="0x... FxrpPay contract" />
      <label>Invoice id</label>
      <input id="pId" type="number" min="0" step="1" placeholder="0" />
      <button id="loadBtn">Load invoice</button>

      <div id="invoiceInfo" style="margin-top:16px;display:none;">
        <div class="muted" id="iMemo"></div>
        <div class="big" id="iAmount"></div>
        <div class="muted" id="iUsd"></div>
        <div class="muted" id="iPayee"></div>
        <div class="muted" id="iStatus"></div>
        <button id="payBtn">Approve &amp; pay</button>
      </div>
      <div id="payStatus"></div>
    </section>
  </div>
</main>

<div id="walletModal" onclick="event.target===this?closeWalletModal():0">
    <div class="wallet-card">
      <h3>Connect a wallet</h3>
      <p class="muted">Choose which wallet extension to use.</p>
      <div id="walletList"></div>
      <div class="wallet-close" onclick="closeWalletModal()">Cancel</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
